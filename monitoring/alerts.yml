groups:
  - name: antifraud-api
    rules:
      - alert: AntifraudHighErrorRate
        expr: |
          (
            sum(rate(antifraud_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(antifraud_http_requests_total[5m])), 0.000001)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Antifraud demo HTTP 5xx rate >1%"
      - alert: AntifraudHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(antifraud_http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Antifraud demo p95 HTTP latency >500ms"
