name: ExtraTrees v4 verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-final-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Six webinar 07 tests and three demos plus E2E
        env:
          PYTHONPATH: src
          ANTIFRAUD_LLM_ENABLED: 'false'
        run: python -m pytest -v -s tests/test_webinar07_extratrees_v4.py tests/test_demo_scenarios_v4.py tests/test_extratrees_v4_e2e.py tests/test_tree_shap_v4.py
